<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a18" />
  <title>AjiLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div id="app">
    <nav id="topnav">
      <button id="nav-back" class="nav-btn hidden" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a href="/" id="nav-brand" class="brand">🍳 AjiLab</a>
      <button id="nav-add" class="nav-btn" aria-label="New recipe" title="New recipe">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </nav>

    <main id="view-container"></main>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-box" role="dialog" aria-modal="true">
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <script src="/js/api.js"></script>
  <script src="/js/cooklang-render.js"></script>
  <script type="module" src="/js/cooklang-editor.js"></script>
  <script src="/js/views-helpers.js"></script>
  <script src="/js/views-recipe-core.js"></script>
  <script src="/js/views-recipe-viewer.js"></script>
  <script src="/js/views-recipe-editor.js"></script>
  <script src="/js/views-recipe-history.js"></script>
  <script src="/js/views-recipe-overview.js"></script>
  <script src="/js/views-recipe-cook-logs.js"></script>
  <script src="/js/views-index.js"></script>
  <script src="/js/views-print.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
