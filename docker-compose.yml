services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipevault
      POSTGRES_USER: recipevault
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-recipevault}"
    volumes:
      - pg_data:/var/lib/postgresql
      # Optional: bind-mount postgresql.conf overrides here
      # - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipevault -d recipevault"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Tune for a small self-hosted instance. Override via .env if needed.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      AUTO_PULL: "${AUTO_PULL:-true}"
      PORT: "3000"
      DATABASE_URL: "postgresql://recipevault:${POSTGRES_PASSWORD:-recipevault}@db:5432/recipevault"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Nightly pg_dump to ./backups at 02:00 local time. Retains 30 days.
  # Writes -Fc (custom format, compressed, includes BYTEA images).
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGHOST: db
      PGUSER: recipevault
      PGPASSWORD: "${POSTGRES_PASSWORD:-recipevault}"
      PGDATABASE: recipevault
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
    entrypoint: >
      /bin/sh -c '
        set -e
        run_backup() {
          FILE=/backups/recipevault-$$(date +%Y%m%d-%H%M%S).dump
          echo "[backup] writing $$FILE"
          if pg_dump -Fc -f $$FILE; then
            ln -sf $$(basename $$FILE) /backups/latest.dump
            find /backups -name "recipevault-*.dump" -mtime +$$BACKUP_RETENTION_DAYS -delete
            echo "[backup] ok"
          else
            echo "[backup] failed" >&2
            rm -f $$FILE
          fi
        }
        # Run once at startup so a fresh install has a backup within minutes.
        run_backup
        # Then loop, sleeping until the next 02:00.
        while true; do
          NOW=$$(date +%s)
          NEXT=$$(date -d "tomorrow 02:00" +%s 2>/dev/null || date -j -f "%Y-%m-%d %H:%M:%S" "$$(date +%Y-%m-%d) 02:00:00" +%s)
          if [ $$NEXT -le $$NOW ]; then NEXT=$$((NEXT + 86400)); fi
          SLEEP=$$((NEXT - NOW))
          echo "[backup] sleeping $$SLEEP s until next run"
          sleep $$SLEEP
          run_backup
        done
      '

  # ---------------------------------------------------------------------------
  # Optional: off-site backup. Syncs ./backups to any cloud provider via rclone
  # (S3, Cloudflare R2, Backblaze B2, GCS, SFTP, Dropbox, …).
  #
  # To enable:
  #   1. Configure rclone locally: `rclone config` → creates ~/.config/rclone/rclone.conf
  #   2. Copy it to ./rclone.conf in this directory
  #   3. Set RCLONE_REMOTE in .env (e.g. "r2:my-bucket/recipevault")
  #   4. Uncomment the block below and run: docker compose up -d
  # ---------------------------------------------------------------------------
  # cloud-backup:
  #   image: rclone/rclone:latest
  #   restart: unless-stopped
  #   depends_on:
  #     - backup
  #   volumes:
  #     - ./backups:/backups:ro
  #     - ./rclone.conf:/config/rclone/rclone.conf:ro
  #   environment:
  #     RCLONE_REMOTE: "${RCLONE_REMOTE}"
  #   entrypoint: >
  #     /bin/sh -c '
  #       while true; do
  #         echo "[cloud-backup] syncing /backups -> $$RCLONE_REMOTE"
  #         rclone sync /backups "$$RCLONE_REMOTE" --include "recipevault-*.dump" || echo "[cloud-backup] failed"
  #         sleep 3600
  #       done
  #     '

volumes:
  node_modules:
  pg_data:
