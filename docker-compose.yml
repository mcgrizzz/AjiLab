services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ajilab
      POSTGRES_USER: ajilab
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ajilab}"
    volumes:
      - pg_data:/var/lib/postgresql
      # Optional: bind-mount postgresql.conf overrides here
      # - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajilab -d ajilab"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Tune for a small self-hosted instance. Override via .env if needed.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      AUTO_PULL: "${AUTO_PULL:-true}"
      PORT: "3000"
      DATABASE_URL: "postgresql://ajilab:${POSTGRES_PASSWORD:-ajilab}@db:5432/ajilab"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Nightly pg_dump to ./backups at 02:00 local time. Retains 30 days.
  # Writes -Fc (custom format, compressed, includes BYTEA images).
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGHOST: db
      PGUSER: ajilab
      PGPASSWORD: "${POSTGRES_PASSWORD:-ajilab}"
      PGDATABASE: ajilab
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
    entrypoint: >
      /bin/sh -c '
        run_backup() {
          FILE=/backups/ajilab-$$(date +%Y%m%d-%H%M%S).dump
          echo "[backup] writing $$FILE"
          if pg_dump -Fc -f "$$FILE"; then
            ln -sf "$$(basename $$FILE)" /backups/latest.dump
            find /backups -name "ajilab-*.dump" -mtime +"$$BACKUP_RETENTION_DAYS" -delete
            echo "[backup] ok"
          else
            echo "[backup] pg_dump failed" >&2
            rm -f "$$FILE"
          fi
        }
        run_backup
        while true; do
          H=$$(date +%H)
          M=$$(date +%M)
          S=$$(date +%S)
          SECS_PAST=$$((H * 3600 + M * 60 + S))
          SECS_TILL_2AM=$$((7200 - SECS_PAST))
          if [ "$$SECS_TILL_2AM" -le 0 ]; then SECS_TILL_2AM=$$((SECS_TILL_2AM + 86400)); fi
          echo "[backup] sleeping $$SECS_TILL_2AM s until 02:00"
          sleep "$$SECS_TILL_2AM"
          run_backup
        done
      '

  # ---------------------------------------------------------------------------
  # Optional: off-site backup. Syncs ./backups to any cloud provider via rclone
  # (S3, Cloudflare R2, Backblaze B2, GCS, SFTP, Dropbox, …).
  #
  # To enable:
  #   1. Configure rclone locally: `rclone config` → creates ~/.config/rclone/rclone.conf
  #   2. Copy it to ./rclone.conf in this directory
  #   3. Set RCLONE_REMOTE in .env (e.g. "r2:my-bucket/ajilab")
  #   4. Uncomment the block below and run: docker compose up -d
  # ---------------------------------------------------------------------------
  # cloud-backup:
  #   image: rclone/rclone:latest
  #   restart: unless-stopped
  #   depends_on:
  #     - backup
  #   volumes:
  #     - ./backups:/backups:ro
  #     - ./rclone.conf:/config/rclone/rclone.conf:ro
  #   environment:
  #     RCLONE_REMOTE: "${RCLONE_REMOTE}"
  #   entrypoint: >
  #     /bin/sh -c '
  #       while true; do
  #         echo "[cloud-backup] syncing /backups -> $$RCLONE_REMOTE"
  #         rclone sync /backups "$$RCLONE_REMOTE" --include "*.dump" || echo "[cloud-backup] failed"
  #         sleep 3600
  #       done
  #     '

volumes:
  node_modules:
  pg_data:
